name: Build checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: TypeScript and Vite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

  desktop:
    name: Python sidecar and Rust on macOS
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Build frontend assets for Tauri
        run: npm ci && npm run build
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - name: Install locked Python dependencies
        run: uv sync --locked --project engine
      - name: Compile Python sources
        run: uv run --locked --project engine python -m compileall -q engine/ai_proxy_engine engine/entrypoint.py
      - name: Freeze the sidecar required by Tauri
        run: bash scripts/freeze-engine.sh
      - name: Check Rust desktop host
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

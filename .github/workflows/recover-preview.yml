name: 恢复已上传的中文预发行
on:
  push:
    branches: ["codex/recover-v0.2.1"]
permissions:
  contents: read
concurrency:
  group: recover-v0.2.1
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: v0.2.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v0.2.1
          persist-credentials: false
      - name: 核对草稿与远端附件
        run: |
          gh api "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          try {
            const releases=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/releases.json`));
            const item=releases.find(r=>r.tag_name===process.env.RELEASE_TAG);
            if(!item)throw new Error('未找到目标版本的草稿；需要检查原发布命令。');
            if(!item.draft)throw new Error('版本已经公开，停止恢复以避免重复修改。');
            const names=item.assets.map(a=>`${a.name}:${a.state}`);
            if(item.assets.length!==4)throw new Error(`草稿附件尚不完整（${item.assets.length}项）：${names.join(', ')}`);
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/release.json`,JSON.stringify(item));
            console.log(`找到草稿 ${item.id}，四个附件已上传。`);
          } catch(error){console.log(`::error::${error.message}`);process.exit(1);}
          JS
          mkdir -p "$RUNNER_TEMP/recovered-assets"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/recovered-assets"
      - name: 核对下载内容并公开
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import crypto from 'node:crypto';import {execFileSync} from 'node:child_process';
          try {
            const version=JSON.parse(fs.readFileSync('package.json')).version;
            const dir=`${process.env.RUNNER_TEMP}/recovered-assets`;
            const build=JSON.parse(fs.readFileSync(`${dir}/AI-Proxy-${version}-macos-arm64-build.json`));
            const remote=JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release.json`));
            const commit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
            if(build.version!==version||build.platform!=='macos-arm64'||build.dirtyWorkingTree||build.commit!==commit||build.licenseTextReviewCount!==0||build.assets.length!==2)throw new Error('草稿构建信息与版本源码不一致');
            for(const item of build.assets){
              if(item.name.includes('/'))throw new Error('非法附件路径');
              const data=fs.readFileSync(`${dir}/${item.name}`),digest=crypto.createHash('sha256').update(data).digest('hex');
              const asset=remote.assets.find(a=>a.name===item.name);
              if(!asset||asset.state!=='uploaded'||asset.size!==item.bytes||data.length!==item.bytes||digest!==item.sha256||(asset.digest&&asset.digest!==`sha256:${digest}`))throw new Error(`附件核对失败：${item.name}`);
            }
            const expected=build.assets.map(a=>`${a.sha256}  ${a.name}`).join('\n')+'\n';
            if(fs.readFileSync(`${dir}/AI-Proxy-${version}-macos-arm64-SHA256SUMS.txt`,'utf8')!==expected)throw new Error('校验清单与实际文件不一致');
            const icon=`<img src="https://raw.githubusercontent.com/${process.env.GITHUB_REPOSITORY}/v${version}/public/brand/app-icon.png" alt="应用图标" width="88" />\n\n`;
            const notes=icon+fs.readFileSync(`docs/release-notes-${version}.md`,'utf8')+`\n\n## 本次构建与文件校验\n\n源码提交：\`${commit}\`。\n\n`+build.assets.map(a=>`- \`${a.name}\`：\`${a.sha256}\``).join('\n')+'\n';
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/verified-notes.md`,notes);
          }catch(error){console.log(`::error::${error.message}`);process.exit(1);}
          JS
          gh release edit "$RELEASE_TAG" --title 'AI 抓包助手 0.2.1 · 中文开发预览' --notes-file "$RUNNER_TEMP/verified-notes.md" --draft=false --prerelease

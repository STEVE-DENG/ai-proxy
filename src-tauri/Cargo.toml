[package]
name = "ai-proxy"
version = "0.2.1"
description = "本地抓包与 AI 辅助接口调试工具"
authors = ["dengxurui"]
license = "MIT"
repository = "https://github.com/STEVE-DENG/ai-proxy"
edition = "2021"

[lib]
name = "ai_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
libc = "0.2"

[project]
name = "ai-proxy-engine"
version = "0.1.0"
description = "Local capture and agent engine for AI Proxy"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mitmproxy>=12.3,<13",
  "pydantic-ai-slim[openai,anthropic]>=2.59,<3",
  "socksio>=1.0,<2",
]

[dependency-groups]
dev = [
  "pyinstaller>=6.11,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_proxy_engine"]

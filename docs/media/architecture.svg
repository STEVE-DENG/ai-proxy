<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
<title id="title">AI 抓包助手架构与数据边界</title><desc id="desc">界面经进程通信调用原生宿主；宿主管理权限和凭据。Python 引擎本地存储流量并执行限定范围的分析，只有分析上下文发送到用户配置的模型服务。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9" fill="none" stroke="#315e4a" stroke-width="1.5"/></marker><style>text{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;fill:#17231e} .title{font-size:28px;font-weight:650}.label{font-size:20px;font-weight:650}.note{font-size:16px;fill:#445a4b}.box{fill:#faf7ef;stroke:#809782;stroke-width:1.5}.flow{fill:none;stroke:#315e4a;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="1280" height="620" rx="20" fill="#eee9dd"/>
<text x="44" y="54" class="title">AI 抓包助手 · 本地采集与范围分析</text>
<rect x="32" y="84" width="914" height="500" rx="18" fill="#e3e8df" stroke="#809782" stroke-dasharray="6 5"/>
<text x="54" y="118" class="note">你的 Mac</text>
<rect x="54" y="150" width="236" height="132" rx="12" class="box"/><text x="74" y="190" class="label">交互界面</text><text x="74" y="222" class="note">抓包、AI 分析与验证</text><text x="74" y="250" class="note">证据定位与操作审批</text>
<rect x="354" y="150" width="242" height="132" rx="12" class="box"/><text x="374" y="190" class="label">原生宿主</text><text x="374" y="222" class="note">进程通信与系统权限</text><text x="374" y="250" class="note">本地凭据文件</text>
<rect x="660" y="150" width="262" height="132" rx="12" class="box"/><text x="680" y="190" class="label">本地分析引擎</text><text x="680" y="222" class="note">范围、版本与脱敏</text><text x="680" y="250" class="note">分析工具与验证流程</text>
<path d="M292 210H350" class="flow"/><path d="M598 210H656" class="flow"/>
<rect x="1010" y="150" width="236" height="132" rx="12" class="box"/><text x="1030" y="190" class="label">已配置的模型服务</text><text x="1030" y="222" class="note">由用户发起模型调用</text><text x="1030" y="250" class="note">脱敏后的分析上下文</text><path d="M924 210H1006" class="flow"/>
<rect x="54" y="380" width="236" height="128" rx="12" class="box"/><text x="74" y="420" class="label">手机或本机应用</text><text x="74" y="452" class="note">主动配置代理</text><text x="74" y="480" class="note">HTTPS 需设备信任证书</text>
<rect x="354" y="380" width="242" height="128" rx="12" class="box"/><text x="374" y="420" class="label">本地 HTTP(S) 代理</text><text x="374" y="452" class="note">请求规则与弱网模拟</text><text x="374" y="480" class="note">采集限额与超时控制</text>
<rect x="660" y="380" width="262" height="128" rx="12" class="box"/><text x="680" y="420" class="label">独立项目存储</text><text x="680" y="452" class="note">数据库、正文与证书</text><text x="680" y="480" class="note">执行记录、证据与报告</text>
<path d="M292 444H350" class="flow"/><path d="M598 444H656" class="flow"/><path d="M792 284V376" class="flow"/>
<rect x="1010" y="380" width="236" height="128" rx="12" class="box"/><text x="1030" y="420" class="label">请求目标服务</text><text x="1030" y="452" class="note">发送会产生真实副作用</text><text x="1030" y="480" class="note">未知结果不自动重发</text>
<path d="M476 510V548H1126V512" class="flow"/>
<text x="54" y="562" class="note">原始本地数据与凭据不会打包进共享证据包。</text>
